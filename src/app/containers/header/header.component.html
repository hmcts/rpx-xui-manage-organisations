<header>
    <app-hmcts-global-header
      [userLoggedIn]="isUserLoggedIn$ | async"
      [showHeaderItems]="showHeaderItems$ | async"
      [headerTitle]="title"
      [navigation]="userNav"
      [isBrandedHeader]="isBrandedHeader"
      (navigate)="onNavigate($event)"
    ></app-hmcts-global-header>
    <app-hmcts-primary-navigation
      [userLoggedIn]="showHeaderItems$ | async"
      [label]=""
      [items]="navItems?.navItems"
      [isBrandedHeader]="isBrandedHeader"
    ></app-hmcts-primary-navigation>
    <div class="hmcts-header__container">
      <div class="govuk-phase-banner">
        <ng-container *xuilibFeatureToggle="'mo-welsh-language'">
          <button
            type="button"
            (click)="toggleLanguage(currentLang === 'cy' ? 'en' : 'cy')"
            class="language govuk-js-link"
          >
            {{ currentLang == 'cy' ? 'English' : currentLang == 'en' ? 'Cymraeg' : 'English' }}
          </button>
        </ng-container>
        <p class="govuk-phase-banner__content">
          <strong class="govuk-tag govuk-phase-banner__content__tag hmcts-phase-banner__tag">BETA</strong>
          <span class="govuk-phase-banner__text">
            {{ 'This is a new service - your' | rpxTranslate }}
            <a
              class="govuk-link"
              href="https://www.smartsurvey.co.uk/s/CCDSurvey/"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'Provide your feedback. This will open in a new tab.' | rpxTranslate"
            >{{ 'feedback' | rpxTranslate }}</a>
            {{ 'will help us to improve it.' | rpxTranslate }}
          </span>
        </p>
      </div>
    </div>
</header>
