@if (errorMessages$ | async; as errorMessages) {
  @if (errorMessages.length > 0) {
    <div class="govuk-error-summary" aria-labelledby="error-summary-title" role="alert" tabindex="-1" data-module="error-summary">
      <h2 class="govuk-error-summary__title" id="error-summary-title">
        There is a problem
      </h2>
      <div class="govuk-error-summary__body">
        <ul class="govuk-list govuk-error-summary__list">
          @for (errorMessage of errorMessages; track trackByFeeAccountError($index, errorMessage)) {
            <li>
              <a href="#fee-error">{{ errorMessage }}</a>
            </li>
          }
        </ul>
      </div>
    </div>
  }
}
<app-hmcts-main-wrapper [title]="'Fee accounts'">
  @if (!(loading$ | async)) {
    <app-account-overview-container
      [isAccountAvailableForOrg]="isOrgAccountAvailable$ | async"
      [oneOrMoreAccountInfoMissing]="oneOrMoreAccountMissing$ | async"
      [columnConfig]="columnConfig" [rows]="accounts$ | async" [firstCellIsHeader]="false" [caption]="''"
    ></app-account-overview-container>
  } @else {
    <div>Loading...</div>
  }
</app-hmcts-main-wrapper>
