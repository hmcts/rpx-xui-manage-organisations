<main id="content" class="govuk-main-wrapper" role="main" tabindex="-1">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <a href="#" class="govuk-back-link" (click)="onBack(); $event.preventDefault()">Back</a>
      <xuilib-hmcts-error-summary [errorMessages]="validationErrors" [header]="'There is a problem'"></xuilib-hmcts-error-summary>
      <span class="govuk-caption-xl">Update organisation name</span>
      <h1 class="govuk-heading-xl">What is your new organisation name?</h1>
      <hr>
      <form [formGroup]="companyHouseFormGroup" (ngSubmit)="onContinue()">
        <div class="govuk-form-group" #companyName [ngClass]="{'govuk-form-group--error': companyNameError}">
          <label class="govuk-label govuk-!-font-weight-bold" for="company-name">
            Enter the name of the organisation
          </label>
          @if (companyNameError) {
            <p class="govuk-error-message">
              <span class="govuk-visually-hidden">Error:</span>{{ companyNameError.message }}
            </p>
          }
          <input class="govuk-input" id="company-name" name="companyName" type="text" formControlName="companyName">
        </div>

        <div class="govuk-button-group">
          <button type="submit" class="govuk-button govuk-button--primary" data-module="govuk-button">
            Continue
          </button>
          <button type="button" class="govuk-js-link" (click)="onCancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</main>
