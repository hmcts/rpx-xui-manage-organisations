<div class="hmcts-header__container">
  <div class="govuk-phase-banner">
    <ng-container *xuilibFeatureToggle="'mo-welsh-language'">
      <button 
        type="button" 
        (click)="toggleLanguage(currentLang === 'cy' ? 'en' : 'cy')"
        class="language govuk-js-link"
      >
        {{ currentLang == 'cy' ? 'English' : currentLang == 'en' ? 'Cymraeg' : 'English' }}
      </button>
    </ng-container>
    <p class="govuk-phase-banner__content">
      <strong class="govuk-tag govuk-phase-banner__content__tag">
        {{ type }}
      </strong>
      <span class="govuk-phase-banner__text">
        {{ 'This is a new service' | rpxTranslate }} - {{ 'your' | rpxTranslate }}
        <a class="govuk-link" href="https://www.smartsurvey.co.uk/s/CCDSurvey/" target="_blank" rel="noopener noreferrer"
          aria-label="Provide your feedback. This will open in a new tab."
        >
          {{ 'feedback' | rpxTranslate }}<span class="visuallyhidden">{{ '(Opens in a new window)' | rpxTranslate }}</span>
        </a>
        {{ 'will help us to improve it.' | rpxTranslate }}
      </span>
    </p>
  </div>
</div>
